name: Ana
options:
  bundleIdPrefix: org.sarmg
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1000000"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  Ana:
    type: application
    platform: iOS
    sources:
      - Ana
    info:
      path: Ana/Info.plist
      properties:
        CFBundleDisplayName: ana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: 用于读取您选择的照片和视频，并通过 HTTPS 备份到自己的服务器。
        NSPhotoLibraryAddUsageDescription: 用于将您从服务器恢复的原始照片和视频写回系统照片库。
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - org.sarmg.ana.processing.v1
    entitlements:
      path: Ana/Ana.entitlements
    dependencies:
      - framework: Vendor/AnaRust.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sarmg.ana
        PRODUCT_NAME: Ana
        CODE_SIGN_STYLE: Automatic
  AnaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AnaTests
    dependencies:
      - target: Ana
      - framework: Vendor/AnaRust.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sarmg.ana.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  AnaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AnaUITests
    dependencies:
      - target: Ana
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sarmg.ana.uitests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ana:
    build:
      targets:
        Ana: all
    test:
      config: Debug
      targets:
        - AnaTests
        - AnaUITests
