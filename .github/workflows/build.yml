name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          components: rustfmt,clippy
      - name: Verify locked client support boundary
        run: python scripts/check-xcsc-source.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./scripts/check-mobile-contract.sh
      - name: Verify gallery selection and preview source guards
        run: python3 scripts/test-gallery-selection.py
      - run: python3 scripts/test-package-ios-ipa.py
      - run: python3 scripts/test-ci-ios-simulator.py
      - run: python3 scripts/test-ci-ios-prepare.py
      - run: python3 scripts/test-ci-ios-lanes.py
      - run: python3 scripts/test-ios-toolchain-checks.py
      - run: ./scripts/check-workflow-supply-chain.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: bash scripts/test-mobile-ffi-c.sh

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Verify locked client support boundary
        run: python scripts/check-xcsc-source.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android37
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17.0.20+101"
          check-latest: false
      - name: Verify the reviewed Java runtime build
        run: |
          java_runtime_version="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.runtime.version = //p')"
          printf 'Java runtime: %s\n' "$java_runtime_version"
          test "$java_runtime_version" = "17.0.20.1+1"
      - name: Verify actual JNI exceptions and current ABI on the host JVM
        run: bash scripts/test-mobile-ffi-jni.sh
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic
      - name: Verify real Gradle metadata aliases and strict runtime source rejection
        run: python3 scripts/test-android-runtime-export.py
      - name: Verify actual Android release runtime sources before compiling
        run: |
          gradle -p clients/android -I "$PWD/scripts/export-android-runtime.gradle" \
            "-PxssiRuntimeExport=$RUNNER_TEMP/xszc-android-runtime.json" :app:exportXssiRuntimeInventory
          python3 scripts/check-android-runtime-inventory.py --export "$RUNNER_TEMP/xszc-android-runtime.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xszc-android-release-runtime-resolution
          path: ${{ runner.temp }}/xszc-android-runtime.json
          if-no-files-found: warn
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Rust Android library
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo ndk -t arm64-v8a -o clients/android/app/src/main/jniLibs build -p xszc-mobile --release --locked
      - run: gradle -p clients/android testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xszc-android-debug
          path: clients/android/app/build/outputs/apk/debug/*.apk

      - name: Prepare Android 17 sandbox tests
        run: |
          sdkmanager "emulator" "system-images;android-37.0;google_apis;x86_64"
          sudo chown "$(id -un)" /dev/kvm
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo ndk -t x86_64 -o clients/android/app/src/main/jniLibs build -p xszc-mobile --release --locked
      - name: Test actual JNI backup on Android 17
        timeout-minutes: 18
        run: bash scripts/test-android-emulator.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xszc-android17-test-results
          path: |
            clients/android/app/build/reports/androidTests/
            clients/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/xszc-emulator.log

  ios_simulator:
    name: iOS simulator tests
    runs-on: xcode-27
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start iOS simulator while preparing toolchains
        run: python3 scripts/ci-ios-simulator.py start
      - name: Prepare XcodeGen and Swift sandbox during Rust restoration
        run: bash scripts/ci-ios-prepare.sh start
      - name: Cache exact iOS Rust toolchain
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.99.0-aarch64-apple-darwin
          key: ios-toolchain-v2-simulator-${{ runner.os }}-${{ runner.arch }}-1.99.0-host-aarch64-apple-ios-sim-minimal-${{ hashFiles('rust-toolchain.toml', 'scripts/verify-ios-rust-toolchain.sh') }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-ios-sim
      - name: Verify actual restored or installed Rust identity and targets
        run: bash scripts/verify-ios-rust-toolchain.sh simulator
      - name: Verify locked client support boundary
        run: python scripts/check-xcsc-source.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ios27-simulator-v1
      - name: Verify stable Xcode 27 and iOS 27 SDKs
        run: bash scripts/verify-ios-toolchain.sh
      - name: Require reviewed XcodeGen and successful Swift sandbox probe
        run: bash scripts/ci-ios-prepare.sh wait
      - name: Verify fresh login DB inside a restricted Apple sandbox
        run: bash scripts/test-mobile-ffi-c.sh
      - run: ./scripts/build-ios-rust.sh simulator
      - run: cd clients/ios && xcodegen generate
      - name: Prepare and build iOS tests once
        timeout-minutes: 10
        run: |
          simulator_udid="$XSZC_TEST_SIMULATOR"
          xcodebuild -project clients/ios/Xszc.xcodeproj -scheme Xszc -sdk iphonesimulator -destination "id=$simulator_udid" -derivedDataPath clients/ios/DerivedData build-for-testing
          python3 scripts/ci-ios-simulator.py wait
      - name: Run iOS account and state isolation tests
        timeout-minutes: 10
        run: |
          xcodebuild -project clients/ios/Xszc.xcodeproj -scheme Xszc -sdk iphonesimulator -destination "id=$XSZC_TEST_SIMULATOR" -derivedDataPath clients/ios/DerivedData -only-testing:XszcTests -collect-test-diagnostics never -parallel-testing-enabled NO test-without-building
      # Fixture import has its own budget so UI tests retain the full timeout.
      - name: Seed iOS UI fixtures
        timeout-minutes: 18
        run: time -p bash scripts/seed-ios-ui.sh "$XSZC_TEST_SIMULATOR"
      # Keep our explicit screenshots/log export; avoid Xcode simulator sysdiagnose
      # collection hanging after a finished suite on hosted Apple runners.
      - name: Run iOS login and gallery UI tests
        timeout-minutes: 18
        run: |
          python3 scripts/test-ios-ui.py "$XSZC_TEST_SIMULATOR" clients/ios/TestResults.xcresult
      - name: Export iOS UI screenshots and diagnostics
        if: always()
        run: |
          mkdir -p dist/ios-ui
          if test -f "$RUNNER_TEMP/xszc-ios-prepare.log"; then
            cp "$RUNNER_TEMP/xszc-ios-prepare.log" dist/ios-ui/preparation.log
          fi
          if test -f "$RUNNER_TEMP/xszc-simulator-boot.log"; then
            cp "$RUNNER_TEMP/xszc-simulator-boot.log" dist/ios-ui/simulator-boot.log
          fi
          if test -f "$RUNNER_TEMP/xszc-ios-live.log"; then
            cp "$RUNNER_TEMP/xszc-ios-live.log" dist/ios-ui/gallery-live.log
          fi
          runner_data="$(xcrun simctl get_app_container "$XSZC_TEST_SIMULATOR" org.sarmg.xszc.uitests.xctrunner data 2>/dev/null || true)"
          if test -n "$runner_data"; then
            find "$runner_data/Documents" -name '*.png' -exec cp {} dist/ios-ui/ \;
          fi
          xcrun simctl spawn "$XSZC_TEST_SIMULATOR" log show --last 15m --info --debug --style compact --predicate 'subsystem == "org.sarmg.xszc"' > dist/ios-ui/gallery.log || true
          if test -f clients/ios/TestResults.xcresult/Info.plist; then
            xcrun xcresulttool export attachments --path clients/ios/TestResults.xcresult --output-path dist/ios-ui/attachments
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xszc-ios-ui
          path: dist/ios-ui/
          if-no-files-found: warn

  ios_device:
    name: iOS device IPA
    runs-on: xcode-27
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare XcodeGen and Swift sandbox during Rust restoration
        run: bash scripts/ci-ios-prepare.sh start
      - name: Cache exact iOS Rust toolchain
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.99.0-aarch64-apple-darwin
          key: ios-toolchain-v2-device-${{ runner.os }}-${{ runner.arch }}-1.99.0-host-aarch64-apple-ios-minimal-${{ hashFiles('rust-toolchain.toml', 'scripts/verify-ios-rust-toolchain.sh') }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-ios
      - name: Verify actual restored or installed Rust identity and targets
        run: bash scripts/verify-ios-rust-toolchain.sh device
      - name: Verify locked client support boundary
        run: python scripts/check-xcsc-source.py
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ios27-device-v1
      - name: Verify stable Xcode 27 and iOS 27 SDKs
        run: bash scripts/verify-ios-toolchain.sh
      - name: Require reviewed XcodeGen and successful Swift sandbox probe
        run: bash scripts/ci-ios-prepare.sh wait
      - name: Verify fresh login DB inside a restricted Apple sandbox
        run: bash scripts/test-mobile-ffi-c.sh
      - run: ./scripts/build-ios-rust.sh device
      - run: cd clients/ios && xcodegen generate
      - name: Build without signing
        run: xcodebuild -project clients/ios/Xszc.xcodeproj -scheme Xszc -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath clients/ios/DerivedData build
      - name: Package unsigned IPA
        run: |
          python3 scripts/package-ios-ipa.py \
            --app clients/ios/DerivedData/Build/Products/Release-iphoneos/Xszc.app \
            --version "$(cat VERSION)" \
            --output "dist/xszc-ios-$(cat VERSION)-unsigned.ipa"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xszc-ios-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    needs: [ios_simulator, ios_device]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every iOS lane to succeed
        env:
          SIMULATOR_RESULT: ${{ needs.ios_simulator.result }}
          DEVICE_RESULT: ${{ needs.ios_device.result }}
        run: |
          test "$SIMULATOR_RESULT" = success
          test "$DEVICE_RESULT" = success
