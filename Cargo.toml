[workspace]
members = [
    "crates/crypto",
    "crates/client-core",
    "crates/mobile-ffi",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.99"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
jni = "=0.22.4"
libc = "0.2"
futures-util = "0.3"
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "~1.53.2", features = ["rt", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
