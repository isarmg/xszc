[package]
name = "ana-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
ana-core = { path = "../client-core" }
ana-crypto = { path = "../crypto" }
serde_json.workspace = true
xcsc = { workspace = true, features = ["mobile-ffi"] }
jni = { workspace = true, optional = true }

[features]
jni-host-tests = ["dep:jni", "xcsc/jni"]

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
xcsc = { workspace = true, features = ["jni", "mobile-ffi"] }

[dev-dependencies]
jni.workspace = true
xcsc = { workspace = true, features = ["jni", "mobile-ffi"] }
tempfile.workspace = true

[lints]
workspace = true
