[package]
name = "xszc-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
xszc-core = { path = "../client-core" }
xszc-crypto = { path = "../crypto" }
serde_json.workspace = true
xcsc = { git = "https://github.com/isarmg/xcsc.git", rev = "9cff5bc1425072533fcb8984ee4820b1f6ab6a5c", version = "=1.0.4", features = ["mobile-ffi"] }
jni = { workspace = true, optional = true }

[features]
jni-host-tests = ["dep:jni", "xcsc/jni"]

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
xcsc = { git = "https://github.com/isarmg/xcsc.git", rev = "9cff5bc1425072533fcb8984ee4820b1f6ab6a5c", version = "=1.0.4", features = ["jni", "mobile-ffi"] }

[dev-dependencies]
jni.workspace = true
xcsc = { git = "https://github.com/isarmg/xcsc.git", rev = "9cff5bc1425072533fcb8984ee4820b1f6ab6a5c", version = "=1.0.4", features = ["jni", "mobile-ffi"] }
tempfile.workspace = true

[lints]
workspace = true
